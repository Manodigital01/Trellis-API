name: Build and TypeScript Check
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate GraphQL TypeScript types
        run: |
          npm run graphql:codegen
          git diff --exit-code -- src/graphql/client/generated.ts

      - name: Validate the machine-readable protocol changelog
        run: npm run changelog:validate

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Test GraphQL gateway and cursor pagination
        run: >-
          npm test -- --runInBand
          src/graphql
          src/discovery/reviews/agent-reviews.service.spec.ts
          src/common/pagination/cursor-pagination.service.spec.ts

      # Runs the full suite and prints the coverage summary against the
      # coverageThreshold floors in jest.config.js. Report-only for now: some
      # suites already fail on main, so this step does not fail the build.
      - name: Test coverage summary
        continue-on-error: true
        run: npm run test:cov -- --coverageReporters=text-summary

      - name: Build project
        run: npm run build

  openapi:
    name: Generate OpenAPI Spec & SDKs (TypeScript + Python)
    runs-on: ubuntu-latest
    # Only run on pushes to main/master (not PRs) to avoid redundant artifact uploads.
    if: github.event_name == 'push'
    needs: build
    env:
      NODE_ENV: development
      # Provide minimal env vars so the app can bootstrap without a real DB.
      # The export script boots with abortOnError:false so it tolerates DB absence.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openapi_gen
      JWT_SECRET: ci-openapi-export-secret
      PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export OpenAPI JSON
        run: npm run openapi:export

      - name: Set up Java (required by OpenAPI Generator CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate TypeScript fetch client
        run: |
          npx @openapitools/openapi-generator-cli@2.13.4 generate \
            -i docs/openapi.json \
            -g typescript-fetch \
            -o sdks/typescript \
            --additional-properties=supportsES6=true,typescriptThreePlus=true

      - name: Generate Python client
        run: |
          npx @openapitools/openapi-generator-cli@2.13.4 generate \
            -i docs/openapi.json \
            -g python \
            -o sdks/python \
            --additional-properties=packageName=trellis_api,packageVersion=${{ github.ref_name }},projectName=trellis-api

      - name: Create SDK package metadata (TypeScript)
        run: |
          cat > sdks/typescript/package.json << 'EOF'
          {
            "name": "@trellis/api-client",
            "version": "0.1.0",
            "description": "TypeScript client for Trellis Backend API",
            "main": "dist/index.js",
            "types": "dist/index.d.ts",
            "module": "dist/esm/index.js",
            "scripts": {
              "build": "tsc",
              "test": "jest",
              "lint": "eslint src --ext .ts"
            },
            "keywords": ["trellis", "structure", "api", "client", "typescript"],
            "author": "Trellis Team",
            "license": "MIT",
            "peerDependencies": {
              "typescript": ">=4.0.0"
            },
            "devDependencies": {
              "typescript": "^5.0.0"
            }
          }
          EOF

      - name: Create SDK package metadata (Python)
        run: |
          cat > sdks/python/setup.py << 'EOF'
          from setuptools import setup, find_packages

          setup(
              name="trellis-api",
              version="0.1.0",
              description="Python client for Trellis Backend API",
              author="Trellis Team",
              license="MIT",
              url="https://github.com/TRELLIS-STELLAR/Trellis-API",
              packages=find_packages(),
              python_requires=">=3.8",
              install_requires=[
                  "urllib3 >= 1.26.0",
                  "python-dateutil >= 2.8.0",
                  "certifi >= 2021.10.8",
                  "six >= 1.13.0",
                  "typing-extensions >= 4.0.0",
              ],
              classifiers=[
                  "Programming Language :: Python :: 3",
                  "Programming Language :: Python :: 3.8",
                  "Programming Language :: Python :: 3.9",
                  "Programming Language :: Python :: 3.10",
                  "Programming Language :: Python :: 3.11",
                  "License :: OSI Approved :: MIT License",
                  "Operating System :: OS Independent",
              ],
          )
          EOF

      - name: Upload OpenAPI JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi.json
          retention-days: 90

      - name: Upload TypeScript client artifact
        uses: actions/upload-artifact@v4
        with:
          name: typescript-client
          path: client/
          retention-days: 30

  pages:
    name: Publish API reference to GitHub Pages
    runs-on: ubuntu-latest
    # Only publish from main so the public docs always reflect the latest merged spec.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: openapi
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download OpenAPI spec artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: pages/

      - name: Build Redoc static reference
        run: |
          mkdir -p pages
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <title>Trellis API Reference</title>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <style>body { margin: 0; padding: 0; }</style>
            </head>
            <body>
              <redoc spec-url="./openapi.json"></redoc>
              <script src="https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js"></script>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
